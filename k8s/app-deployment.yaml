apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterannonce-app
spec:
  replicas: 2 # Scalabilité exigée par le TP
  selector:
    matchLabels:
      app: masterannonce-app
  template:
    metadata:
      labels:
        app: masterannonce-app
    spec:
      containers:
        - name: masterannonce-app
          image: masterannonce:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
---
apiVersion: v1
kind: Service
metadata:
  name: masterannonce-service
spec:
  type: NodePort
  selector:
    app: masterannonce-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080